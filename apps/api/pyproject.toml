[project]
name = "cwas"
version = "0.1.0"
description = "Content Writing Multimodal Multi-Agent System - backend"
readme = "README.md"
authors = [
    { name = "Vishesh", email = "visheshvasu2305@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.1.0",
    "ddgs>=9.16.0",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.5.0",
    "textstat>=0.7.13",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["cwas"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "textstat.*", "ddgs.*"]
ignore_missing_imports = true
