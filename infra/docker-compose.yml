name: cwas

services:
  postgres:
    # Postgres 17 + pgvector: app data and the vector knowledge base (wired in a later phase).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cwas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cwas}
      POSTGRES_DB: cwas
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwas -d cwas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Page/search cache and the background job queue (wired in a later phase).
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  languagetool:
    # Self-hosted grammar checker used by the Grammar & Readability agent.
    image: erikvl87/languagetool:latest
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    ports:
      - "${LANGUAGETOOL_PORT:-8010}:8010"

  api:
    build: ../apps/api
    env_file:
      - path: ../apps/api/.env
        required: false
    environment:
      LANGUAGETOOL_URL: http://languagetool:8010
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      languagetool:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
